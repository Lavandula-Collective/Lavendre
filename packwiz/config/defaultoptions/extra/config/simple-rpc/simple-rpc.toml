		state = "Chilling in the menu"
		largeImageKey = ["lavendre_release_icon"]
		largeImageText = "It's Minecraft {{game.version}}, but modded"
		smallImageKey = ["{{images.player}}"]
		smallImageText = "{{player.name}}"
